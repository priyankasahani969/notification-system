<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notification Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        /* ================= LOGIN ================= */

        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .login-card h1 {
            text-align: center;
            margin: 0;
            font-size: 28px;
        }

        .login-card p {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin: 8px 0 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        #loginStatus {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        /* ================= DASHBOARD ================= */

        .dashboard {
            display: none;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            margin: 0;
            font-size: 22px;
        }

        .brand span {
            color: #6b7280;
            font-size: 13px;
        }

        .logout-btn {
            border: none;
            background: #ef4444;
            color: white;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h2 {
            margin: 0 0 6px;
            font-size: 26px;
        }

        .page-header p {
            margin: 0;
            color: #6b7280;
        }

        .table-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }

        th {
            background: #111827;
            color: white;
            font-size: 14px;
        }

        td:first-child {
            text-align: left;
        }

        tr:hover td {
            background: #f9fafb;
        }

        .channel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
        }

        .status {
            font-size: 12px;
            font-weight: bold;
            padding: 4px 9px;
            border-radius: 20px;
        }

        .active {
            color: #166534;
            background: #dcfce7;
        }

        .inactive {
            color: #991b1b;
            background: #fee2e2;
        }

        button {
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .edit {
            background: #2563eb;
            color: white;
        }

        .toggle {
            background: #6b7280;
            color: white;
        }

        .test {
            background: #16a34a;
            color: white;
        }

        .create {
            background: #7c3aed;
            color: white;
        }

        .empty-message {
            padding: 30px;
            color: #6b7280;
        }

        @media (max-width: 700px) {

            .topbar {
                padding: 15px 20px;
            }

            .brand h1 {
                font-size: 18px;
            }

            .main {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>


<!-- ================= ADMIN LOGIN ================= -->

<div class="login-page" id="loginPage">

    <div class="login-card">

        <h1>Admin Login</h1>

        <p>
            Sign in to manage notification templates
        </p>

        <form id="adminLoginForm">

            <div class="form-group">

                <label for="adminUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="adminUsername"
                    placeholder="Enter admin username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn">
                Login
            </button>

        </form>

        <div id="loginStatus"></div>

    </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div class="dashboard" id="dashboard">

    <div class="topbar">

        <div class="brand">

            <h1>
                Notification Admin
            </h1>

            <span>
                Notification Management System
            </span>

        </div>

        <button
            class="logout-btn"
            onclick="adminLogout()">
            Logout
        </button>

    </div>


    <div class="main">

        <div class="page-header">

            <h2>
                Notification Templates
            </h2>

            <p>
                Manage notification triggers and channel templates.
            </p>

        </div>


        <div class="table-card">

            <table>

                <thead>

                    <tr>
                        <th>Trigger</th>
                        <th>WhatsApp</th>
                        <th>Email</th>
                        <th>Web Push</th>
                    </tr>

                </thead>


                <tbody id="notificationTable">

                    <tr>
                        <td colspan="4" class="empty-message">
                            Loading...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

const API_URL = "http://localhost:8000/api";

/* ================= CSRF ================= */

function getCookie(name) {

    const cookies = document.cookie.split(";");

    for (let cookie of cookies) {

        cookie = cookie.trim();

        if (cookie.startsWith(name + "=")) {

            return decodeURIComponent(
                cookie.substring(name.length + 1)
            );

        }
    }

    return null;
}


/* ================= ADMIN LOGIN ================= */

document
    .getElementById("adminLoginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
            document.getElementById("adminUsername").value;

        const password =
            document.getElementById("adminPassword").value;

        const status =
            document.getElementById("loginStatus");

        try {

            /*
             * First request creates the CSRF cookie.
             */

            await fetch(
                `${API_URL}/csrf/`,
                {
                    method: "GET",
                    credentials: "include"
                }
            );


            const response = await fetch(
                `${API_URL}/admin-login/`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.error ||
                    "Admin login failed"
                );

            }


            status.innerText =
                "Login successful!";


            document.getElementById(
                "loginPage"
            ).style.display = "none";


            document.getElementById(
                "dashboard"
            ).style.display = "block";


            await loadNotifications();


        } catch (error) {

            console.error(error);

            status.innerText =
                "Error: " + error.message;

        }

    });


/* ================= LOAD NOTIFICATIONS ================= */

async function loadNotifications() {

    try {

        const triggerResponse = await fetch(
            `${API_URL}/triggers/`,
            {
                credentials: "include"
            }
        );


        const templateResponse = await fetch(
            `${API_URL}/templates/`,
            {
                credentials: "include"
            }
        );


        if (!triggerResponse.ok ||
            !templateResponse.ok) {

            throw new Error(
                "Unauthorized. Please login again."
            );

        }


        const triggers =
            await triggerResponse.json();

        const templates =
            await templateResponse.json();


        const table =
            document.getElementById(
                "notificationTable"
            );


        table.innerHTML = "";


        triggers.forEach(trigger => {

            const channels = [
                "whatsapp",
                "email",
                "web_push"
            ];


            let row = `<tr>`;


            row += `
                <td>
                    <strong>
                        ${trigger.name}
                    </strong>
                </td>
            `;


            channels.forEach(channel => {

                const template =
                    templates.find(
                        item =>
                            item.trigger === trigger.id &&
                            item.channel === channel
                    );


                if (template) {

                    const statusClass =
                        template.is_active
                        ? "active"
                        : "inactive";


                    const statusText =
                        template.is_active
                        ? "ON"
                        : "OFF";


                    row += `
                        <td>

                            <div class="channel">

                                <span
                                    class="status ${statusClass}">
                                    ${statusText}
                                </span>


                                <button
                                    class="edit"
                                    onclick="editTemplate(${template.id})">
                                    Edit
                                </button>


                                <button
                                    class="toggle"
                                    onclick="toggleTemplate(
                                        ${template.id},
                                        ${template.is_active}
                                    )">
                                    Toggle
                                </button>


                                <button
                                    class="test"
                                    onclick="testTemplate('${channel}')">
                                    Test
                                </button>

                            </div>

                        </td>
                    `;

                } else {

                    row += `
                        <td>

                            <button
                                class="create"
                                onclick="createTemplate(
                                    ${trigger.id},
                                    '${channel}'
                                )">
                                Create
                            </button>

                        </td>
                    `;

                }

            });


            row += `</tr>`;


            table.innerHTML += row;

        });

    } catch (error) {

        console.error(error);


        document.getElementById(
            "notificationTable"
        ).innerHTML = `
            <tr>
                <td colspan="4" class="empty-message">
                    ${error.message}
                </td>
            </tr>
        `;

    }
}


/* ================= TOGGLE ================= */

async function toggleTemplate(
    id,
    currentStatus
) {

    try {

        const response = await fetch(
            `${API_URL}/templates/${id}/`,
            {
                method: "PATCH",

                headers: {
                    "Content-Type": "application/json",

                    "X-CSRFToken":
                        getCookie("csrftoken")
                },

                credentials: "include",

                body: JSON.stringify({
                    is_active: !currentStatus
                })
            }
        );


        if (!response.ok) {

            throw new Error(
                "Failed to update template"
            );

        }


        await loadNotifications();


    } catch (error) {

        alert(error.message);

    }
}


/* ================= EDIT ================= */

async function editTemplate(id) {

    try {

        const response = await fetch(
            `${API_URL}/templates/${id}/`,
            {
                credentials: "include"
            }
        );


        if (!response.ok) {

            throw new Error(
                "Failed to load template"
            );

        }


        const template =
            await response.json();


        const subject =
            prompt(
                "Enter Subject:",
                template.subject || ""
            );


        if (subject === null) {
            return;
        }


        const content =
            prompt(
                "Enter Content:",
                template.content || ""
            );


        if (content === null) {
            return;
        }


        const updateResponse =
            await fetch(
                `${API_URL}/templates/${id}/`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type": "application/json",

                        "X-CSRFToken":
                            getCookie("csrftoken")
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        subject: subject,
                        content: content
                    })
                }
            );


        if (!updateResponse.ok) {

            throw new Error(
                "Failed to update template"
            );

        }


        alert(
            "Template updated successfully!"
        );


        await loadNotifications();


    } catch (error) {

        console.error(error);

        alert(error.message);

    }
}


/* ================= CREATE ================= */

async function createTemplate(
    triggerId,
    channel
) {

    const subject =
        prompt("Enter Subject:");


    if (subject === null) {
        return;
    }


    const content =
        prompt("Enter Content:");


    if (content === null) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/templates/`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",

                        "X-CSRFToken":
                            getCookie("csrftoken")
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        trigger: triggerId,
                        channel: channel,
                        subject: subject,
                        content: content,
                        is_active: true
                    })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.detail ||
                "Failed to create template"
            );

        }


        alert(
            "Template created successfully!"
        );


        await loadNotifications();


    } catch (error) {

        console.error(error);

        alert(error.message);

    }
}


/* ================= TEST ================= */

function testTemplate(channel) {

    if (channel === "email") {

        window.open(
            `${API_URL}/test-email/`,
            "_blank"
        );

    }

    else if (channel === "web_push") {

        window.open(
            `${API_URL}/test-web-push/`,
            "_blank"
        );

    }

    else {

        alert(
            "WhatsApp test will be added after WhatsApp API integration."
        );

    }
}


/* ================= LOGOUT ================= */

function adminLogout() {

    window.location.reload();

}

</script>

</body>
</html>
