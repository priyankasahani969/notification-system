<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Create Account - Notification System</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
    }

    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .header h1 {
        margin: 0;
        font-size: 28px;
        color: #1f2937;
    }

    .header p {
        margin-top: 8px;
        color: #6b7280;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 17px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 600;
        color: #374151;
    }

    input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: 0.2s;
    }

    input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.10);
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: translateY(-1px);
        opacity: 0.92;
    }

    .login-link {
        text-align: center;
        margin-top: 22px;
        font-size: 14px;
        color: #6b7280;
    }

    .login-link a {
        color: #4f46e5;
        text-decoration: none;
        font-weight: 600;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    #status {
        margin-top: 18px;
        padding: 10px;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
        color: #374151;
        background: #f3f4f6;
        min-height: 38px;
    }
</style>


</head>

<body>

<div class="container">


<div class="header">
    <h1>Create Account</h1>
    <p>Register to use the Notification System</p>
</div>

<form id="registerForm">

    <div class="form-group">
        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter your username"
            required
        >
    </div>

    <div class="form-group">
        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >
    </div>

    <div class="form-group">
        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
        >
    </div>

    <button type="submit">
        Create Account
    </button>

</form>

<p class="login-link">
    Already have an account?
    <a href="index.html">Login</a>
</p>

<p id="status">Ready</p>

</div>






<script>

document.getElementById("registerForm").addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value;

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const status =
            document.getElementById("status");

        try {

            const response = await fetch(
                "http://127.0.0.1:8000/api/register/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.error || "Registration failed"
                );
            }

            status.innerText =
                "Registration successful! Redirecting to login...";

            setTimeout(function () {
                window.location.href = "index.html";
            }, 1500);

        } catch (error) {

            console.error(error);

            status.innerText =
                "Error: " + error.message;
        }

    }
);

</script>
</body>
</html>
