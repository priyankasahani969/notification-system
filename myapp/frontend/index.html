<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notification System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            color: #1f2937;
        }

        .header p {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.10);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        #subscribeBtn {
            background: #4f46e5;
            color: white;
        }

        #loginBtn {
            background: #16a34a;
            color: white;
        }

        #logoutBtn {
            background: #dc2626;
            color: white;
        }

        .divider {
            margin: 25px 0;
            border-top: 1px solid #e5e7eb;
        }

        #status {
            margin-top: 18px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            color: #374151;
            background: #f3f4f6;
            min-height: 38px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Notification System</h1>
        <p>Login and manage browser notifications</p>
    </div>

    <div class="form-group">
        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter your username"
        >
    </div>

    <div class="form-group">
        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >
    </div>

    <button id="loginBtn">
        Login
    </button>
    <p style="text-align:center; margin-top:20px;">
    New user?
    <a href="register.html" style="color:#4f46e5; text-decoration:none; font-weight:600;">
        Create an account
    </a>
    </p>

    <button id="subscribeBtn">
        Enable Notifications
    </button>

    <button id="logoutBtn">
        Logout
    </button>

    <p id="status"></p>

</div>


<script>

const VAPID_PUBLIC_KEY =
"BBKYDW9VONgU8F25Llb0lSY3W97GWx5wr4S7VG93fSj5SoY7WGASCneetw-bYQnY7RpqyFs2IqkG2jEHeK-dhB0";


/* =========================
   ENABLE NOTIFICATIONS
========================= */

document.getElementById("subscribeBtn").addEventListener(
    "click",
    async function () {

        try {

            if (!("serviceWorker" in navigator)) {
                throw new Error(
                    "Service Worker is not supported."
                );
            }

            if (!("PushManager" in window)) {
                throw new Error(
                    "Push notifications are not supported."
                );
            }

            const permission =
                await Notification.requestPermission();

            if (permission !== "granted") {

                document.getElementById("status").innerText =
                    "Notification permission was denied.";

                return;
            }

            const registration =
                await navigator.serviceWorker.register(
                    "/service-worker.js"
                );

            await navigator.serviceWorker.ready;

            const subscription =
                await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey:
                        urlBase64ToUint8Array(
                            VAPID_PUBLIC_KEY
                        )
                });

            const response = await fetch(
              "https://notification-system-eta-seven.vercel.app",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify(subscription)
                }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.error ||
                    "Failed to save subscription"
                );
            }

            document.getElementById("status").innerText =
                "Notifications enabled successfully!";

        } catch (error) {

            console.error(error);

            document.getElementById("status").innerText =
                "Error: " + error.message;
        }

    }
);


/* =========================
   LOGIN
========================= */

document.getElementById("loginBtn").addEventListener(
    "click",
    async function () {

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        if (!username || !password) {

            document.getElementById("status").innerText =
                "Please enter username and password.";

            return;
        }

        try {

            const response = await fetch(
                "https://notification-system-1-cumz.onrender.com/api/login/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

            const result = await response.json();

            if (!response.ok) {

                throw new Error(
                    result.error || "Login failed"
                );
            }

            document.getElementById("status").innerText =
                "Login successful!";
            localStorage.setItem("loggedInUsername", username);

        } catch (error) {

            console.error(error);

            document.getElementById("status").innerText =
                "Error: " + error.message;
        }

    }
);


/* =========================
   LOGOUT
========================= */

document.getElementById("logoutBtn").addEventListener(
    "click",
    async function () {

        try {

            const username = localStorage.getItem("loggedInUsername");

            const response = await fetch(
                "https://notification-system-1-cumz.onrender.com/api/logout/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        username: username
                    })
                }
            );

            const result = await response.json();

            if (!response.ok) {

                throw new Error(
                    result.error || "Logout failed"
                );
            }

            document.getElementById("status").innerText =
                "Logout successful!";

        } catch (error) {

            console.error(error);

            document.getElementById("status").innerText =
                "Error: " + error.message;
        }

    }
);


/* =========================
   VAPID KEY CONVERSION
========================= */

function urlBase64ToUint8Array(base64String) {

    const padding = "=".repeat(
        (4 - base64String.length % 4) % 4
    );

    const base64 =
        (base64String + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    const rawData =
        window.atob(base64);

    return Uint8Array.from(
        [...rawData].map(
            char => char.charCodeAt(0)
        )
    );
}

</script>

</body>
</html>
