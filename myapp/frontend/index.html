<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notification System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            color: #1f2937;
        }

        .header p {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.10);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        #subscribeBtn {
            background: #4f46e5;
            color: white;
        }

        #loginBtn {
            background: #16a34a;
            color: white;
        }

        #logoutBtn {
            background: #dc2626;
            color: white;
        }

        .divider {
            margin: 25px 0;
            border-top: 1px solid #e5e7eb;
        }

        #status {
            margin-top: 18px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            color: #374151;
            background: #f3f4f6;
            min-height: 38px;
        }
        .btn-loader {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        button.loading {
            opacity: 0.75;
            cursor: not-allowed;
            pointer-events: none;
        }

        button.loading .btn-text {
            display: none;
        }

        button.loading .btn-loader {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #logoutBtn.loading {
    opacity: 0.75;
    cursor: not-allowed;
    pointer-events: none;
}

#logoutBtn.loading .btn-text {
    display: none;
}

#logoutBtn.loading .btn-loader {
    display: block;
}

.btn-loader {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Notification System</h1>
        <p>Login and manage browser notifications</p>
    </div>

<div class="form-group">
    <div class="form-group">
        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter your username"
        >
    </div>

    <div class="form-group">
        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >
    </div>

    <button id="loginBtn" type="button">
    <span class="btn-text">Login</span>
    <span class="btn-loader"></span>
    </button>
    <p style="text-align:center; margin-top:20px;">
    New user?
    <a href="register.html" style="color:#4f46e5; text-decoration:none; font-weight:600;">
        Create an account
    </a>
    </p>

    <div id="notificationSection" style="display:none; margin-top:20px;">

    <div style="
        padding:15px;
        background:#f8fafc;
        border:1px solid #e5e7eb;
        border-radius:10px;
    ">

        <div id="notificationTitle" style="
            font-weight:600;
            color:#1f2937;
            margin-bottom:5px;
        ">
            🔔 Stay updated
        </div>

        <div id="notificationText" style="
            font-size:13px;
            color:#6b7280;
            margin-bottom:10px;
        ">
            Get instant notifications about your account activity.
        </div>

        <button id="subscribeBtn">
            Enable Notifications
        </button>

    </div>

</div>

    <button id="logoutBtn">
    <span class="btn-text">Logout</span>
    <span class="btn-loader"></span>
</button>

    <p id="status"></p>
    <p style="text-align:right; margin:18px 0 0;">
        <a
            href="admin.html"
            style="
                color:#4f46e5;
                text-decoration:none;
                font-size:13px;
                font-weight:600;
            "
        >
            Admin Login →
        </a>
    </p>

</div>


<script>

const VAPID_PUBLIC_KEY =
"BBKYDW9VONgU8F25Llb0lSY3W97GWx5wr4S7VG93fSj5SoY7WGASCneetw-bYQnY7RpqyFs2IqkG2jEHeK-dhB0";


/* =========================
   ENABLE NOTIFICATIONS
========================= */
async function updateNotificationUI() {

    const section =
        document.getElementById("notificationSection");

    const button =
        document.getElementById("subscribeBtn");

    const title =
        document.getElementById("notificationTitle");

    const text =
        document.getElementById("notificationText");

    const loggedInUsername =
        localStorage.getItem("loggedInUsername");


    // User is not logged in
    if (!loggedInUsername) {

        section.style.display = "none";

        return;
    }


    // User is logged in
    section.style.display = "block";


    if (!("Notification" in window)) {

        button.disabled = true;
        button.innerText =
            "Notifications unavailable";

        title.innerText =
            "Notifications unavailable";

        text.innerText =
            "Your browser does not support notifications.";

        return;
    }


    if (Notification.permission === "denied") {

        button.disabled = true;
        button.innerText =
            "Notifications blocked";

        title.innerText =
            "🔕 Notifications are blocked";

        text.innerText =
            "Please allow notifications in your browser settings.";

        return;
    }


    if (Notification.permission === "granted") {

        try {

            const registration =
                await navigator.serviceWorker.ready;

            const subscription =
                await registration.pushManager.getSubscription();


            if (subscription) {

                button.disabled = true;

                button.innerText =
                    "✓ Notifications enabled";

                title.innerText =
                    "✓ Notifications enabled";

                text.innerText =
                    "You’ll receive important account notifications here.";

                return;
            }

        } catch (error) {

            console.error(
                "Subscription check failed:",
                error
            );
        }
    }


    // User is logged in but notifications are not enabled
    button.disabled = false;

    button.innerText =
        "Enable Notifications";

    title.innerText =
        "🔔 Stay updated";

    text.innerText =
        "Get instant notifications about your account activity.";
}


document.getElementById("subscribeBtn").addEventListener(
    "click",
    async function () {

        const button =
            document.getElementById("subscribeBtn");

        const status =
            document.getElementById("status");

        try {

            // Prevent multiple clicks
            button.disabled = true;
            button.innerText = "Enabling...";

            if (!("serviceWorker" in navigator)) {
                throw new Error(
                    "Service Worker is not supported."
                );
            }

            if (!("PushManager" in window)) {
                throw new Error(
                    "Push notifications are not supported."
                );
            }

            const permission =
                await Notification.requestPermission();

            if (permission !== "granted") {

                button.disabled = true;
                button.innerText =
                    "Notifications blocked";

                status.innerText =
                    "Please allow notifications in your browser settings.";

                return;
            }

            const registration =
                await navigator.serviceWorker.register(
                    "/service-worker.js"
                );

            await navigator.serviceWorker.ready;

            // Check if subscription already exists
            let subscription =
                await registration.pushManager.getSubscription();

            // Create subscription only if it doesn't exist
            if (!subscription) {

                subscription =
                    await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey:
                            urlBase64ToUint8Array(
                                VAPID_PUBLIC_KEY
                            )
                    });
            }

            const csrfResponse =
                await fetch(
                   "https://notification-system-1-cumz.onrender.com/api/csrf/",
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );

            const csrfData =
                await csrfResponse.json();

            const csrfToken =
                csrfData.csrfToken;

            console.log(
                "CSRF TOKEN:",
                csrfToken
            );

            const response =
                await fetch(
                   "https://notification-system-1-cumz.onrender.com/api/save-push-subscription/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": csrfToken
                        },

                        credentials: "include",

                        body:
                            JSON.stringify(subscription)
                    }
                );

            const result =
                await response.json();

            console.log(
                "STATUS:",
                response.status
            );

            console.log(
                "RESPONSE:",
                result
            );

            if (!response.ok) {
                throw new Error(
                    result.error ||
                    "Failed to save subscription"
                );
            }

            // Success UI
            button.disabled = true;
            button.innerText =
                "✓ Notifications enabled";

            status.innerText =
                "Notifications enabled successfully!";

        } catch (error) {

            console.error(error);

            status.innerText =
                "Error: " + error.message;

            // Allow retry if something failed
            button.disabled = false;
            button.innerText =
                "Enable notifications";
        }
    }
);


// Check notification state when page loads
window.addEventListener(
    "load",
    updateNotificationUI
);


function getCookie(name) {

    const value =
        `; ${document.cookie}`;

    const parts =
        value.split(`; ${name}=`);

    if (parts.length === 2) {
        return parts
            .pop()
            .split(";")
            .shift();
    }

    return null;
}

/* =========================
   LOGIN
========================= */
document.getElementById("loginBtn").addEventListener(
    "click",
    async function () {

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        const status =
            document.getElementById("status");

        if (!username || !password) {

            status.innerText =
                "Please enter username and password.";

            return;
        }

        const loginBtn =
            document.getElementById("loginBtn");

        loginBtn.classList.add("loading");
        status.innerText = "Logging in...";

        try {

            const response = await fetch(
                "https://notification-system-1-cumz.onrender.com/api/login/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.error || "Login failed"
                );
            }

            localStorage.setItem(
                "loggedInUsername",
                username
            );

            status.innerText =
                "✓ Login successful!";
            await updateNotificationUI();

        } catch (error) {

            console.error(error);

            status.innerText =
                "✕ " + error.message;

        } finally {

            loginBtn.classList.remove("loading");

        }
    }
);

/* =========================
   LOGOUT
========================= */document.getElementById("logoutBtn").addEventListener(
    "click",
    async function () {

        const logoutBtn =
            document.getElementById("logoutBtn");

        const status =
            document.getElementById("status");

        // Show loading state
        logoutBtn.classList.add("loading");
        status.innerText = "Logging out...";

        try {

            const username =
                localStorage.getItem("loggedInUsername");

            // Get CSRF token
            const csrfResponse = await fetch(
                "https://notification-system-1-cumz.onrender.com/api/csrf/",
                {
                    method: "GET",
                    credentials: "include"
                }
            );

            const csrfData =
                await csrfResponse.json();

            const csrfToken =
                csrfData.csrfToken;

            console.log(
                "LOGOUT CSRF TOKEN:",
                csrfToken
            );


            // Logout request
            const response = await fetch(
                "https://notification-system-1-cumz.onrender.com/api/logout/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        username: username
                    })
                }
            );


            const result =
                await response.json();

            console.log(
                "LOGOUT STATUS:",
                response.status
            );

            console.log(
                "LOGOUT RESPONSE:",
                result
            );


            if (!response.ok) {

                throw new Error(
                    result.error ||
                    result.detail ||
                    "Logout failed"
                );
            }


            // Remove logged-in username
            localStorage.removeItem(
                "loggedInUsername"
            );
            document.getElementById(
                "notificationSection"
            ).style.display = "none";

            status.innerText =
                "✓ Logout successful!";

        } catch (error) {

            console.error(error);

            status.innerText =
                "✕ Error: " + error.message;

        } finally {

            // Remove loading state
            logoutBtn.classList.remove("loading");
        }

    }
);

/* =========================
   VAPID KEY CONVERSION
========================= */

function urlBase64ToUint8Array(base64String) {

    const padding = "=".repeat(
        (4 - base64String.length % 4) % 4
    );

    const base64 =
        (base64String + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    const rawData =
        window.atob(base64);

    return Uint8Array.from(
        [...rawData].map(
            char => char.charCodeAt(0)
        )
    );
}

</script>

</body>
</html>
